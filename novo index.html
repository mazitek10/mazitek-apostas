<style id="mazitek-3d-balls">
/* Acabamento das bolas: bola sólida colorida com selo branco do número (estilo clássico de sinuca) */
.ball{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border:2px solid rgba(255,255,255,.9)!important;
  box-shadow:
    0 7px 10px rgba(0,0,0,.55),
    0 2px 2px rgba(0,0,0,.65),
    inset 0 7px 10px rgba(255,255,255,.25),
    inset 0 -10px 13px rgba(0,0,0,.35)!important;
  color:#111!important;
  text-shadow:none;
}
.ball::before{
  content:"";
  position:absolute;
  z-index:-1;
  width:58%;
  height:58%;
  left:21%;
  top:21%;
  border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#ffffff 0%,#f6f6f6 55%,#e0e0e0 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 -2px 3px rgba(0,0,0,.08);
  pointer-events:none;
}
.ball::after{
  content:"";
  position:absolute;
  z-index:-2;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 32% 24%,
    rgba(255,255,255,.55) 0 8%,
    rgba(255,255,255,0) 36%,
    rgba(0,0,0,.06) 60%,
    rgba(0,0,0,.4) 100%);
  pointer-events:none;
}
.ball.yellow{background:radial-gradient(circle at 32% 25%,#fff4a0 0%,#ffd83d 27%,#e2ad00 68%,#775300 100%)}
.ball.blue{background:radial-gradient(circle at 32% 25%,#8bc5ff 0%,#218be5 28%,#0753aa 68%,#031d54 100%)}
.ball.red{background:radial-gradient(circle at 32% 25%,#ff9b91 0%,#ef4138 28%,#b51612 68%,#520504 100%)}
.ball.purple{background:radial-gradient(circle at 32% 25%,#e6a5ff 0%,#a63ac4 28%,#6f168b 68%,#30043f 100%)}
.ball.orange{background:radial-gradient(circle at 32% 25%,#ffd09a 0%,#ff9228 28%,#d95a00 68%,#713000 100%)}
.ball.green{background:radial-gradient(circle at 32% 25%,#a2efac 0%,#45b95a 28%,#167a2d 68%,#063714 100%)}
.ball.brown{background:radial-gradient(circle at 32% 25%,#d4a68e 0%,#8b5a43 30%,#583322 68%,#24130d 100%)}
.ball.black{background:radial-gradient(circle at 32% 25%,#a9a9a9 0%,#383838 27%,#111 62%,#000 100%)}
.ball.wine{background:radial-gradient(circle at 32% 25%,#df8585 0%,#8e2929 30%,#5e1010 68%,#280606 100%)}
.ball.pink{background:radial-gradient(circle at 32% 25%,#ffd0e6 0%,#ef79ad 30%,#c43e7c 68%,#68173f 100%)}
.ball.off{opacity:.22!important;filter:grayscale(1) brightness(.78)!important;box-shadow:inset 0 5px 8px rgba(255,255,255,.14),inset 0 -8px 10px rgba(0,0,0,.5)!important}
</style>

let prevScores={1:0,2:0};
function pulse(...els){els.forEach(el=>{if(!el)return;el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')})}
function renderTacada(s,isRb){tacadaBar.classList.toggle('show',isRb);if(!isRb)return;const t=s.tacada||{jogador:0,bolas:[],total:0};tacadaBalls.innerHTML='';(t.bolas||[]).forEach(b=>{const d=document.createElement('div');d.className='ball '+(b.c||'yellow');d.textContent=b.v??'';tacadaBalls.appendChild(d)});tacadaTotal.textContent=t.total||0}
function renderSeries(s){
  const ser=s.series||{enabled:false,size:5,scores:[]};
  seriesBar.classList.toggle('show',!!ser.enabled&&ser.scores.length>0);
  if(!ser.enabled)return;
  seriesBar.innerHTML='';
  ser.scores.forEach((sc,i)=>{
    const slot=document.createElement('div');slot.className='series-slot';
    const idx=document.createElement('div');idx.className='series-slot-index';idx.textContent='SÉRIES '+(i+1);
    const pair=document.createElement('div');pair.className='series-slot-pair';
    const a=document.createElement('div');a.className='series-num'+(sc.a>sc.b?' winner':'');a.textContent=sc.a;
    const x=document.createElement('div');x.className='series-x';x.textContent='X';
    const b=document.createElement('div');b.className='series-num'+(sc.b>sc.a?' winner':'');b.textContent=sc.b;
    pair.appendChild(a);pair.appendChild(x);pair.appendChild(b);
    slot.appendChild(idx);slot.appendChild(pair);
    seriesBar.appendChild(slot);
  });
}
function render(data){const s=norm(data);apply(s.appearance);name1.textContent=rowName1.textContent=s.name1;name2.textContent=rowName2.textContent=s.name2;fitNames(s);cityValue.textContent=s.city;if(s.score1!==prevScores[1])pulse(score1,rowScore1);if(s.score2!==prevScores[2])pulse(score2,rowScore2);prevScores={1:s.score1,2:s.score2};scoreNum1.textContent=rowScoreNum1.textContent=s.score1;scoreNum2.textContent=rowScoreNum2.textContent=s.score2;const isRb=s.mode==='regra_brasileira';gamesBarNum1.textContent=Number(s.partidas?.[1])||0;gamesBarNum2.textContent=Number(s.partidas?.[2])||0;gamesBar.classList.toggle('show',isRb);renderTacada(s,isRb);renderSeries(s);const shared=MODES[s.mode]==='shared';const inline=s.ballLayout==='after_name';topBar.style.display=inline?'none':'grid';playerRows.style.display=inline?'grid':'none';playerRows.classList.toggle('shared',shared);playerRows.classList.toggle('balls-hidden',!s.showBalls);bottomBar.style.display=(inline||!s.showBalls)?'none':'grid';messageArea.textContent=s.message||'';messageArea.classList.toggle('show',s.showMessage&&!!String(s.message||'').trim());renderBalls(s);document.querySelector('.scoreboard-wrap').classList.toggle('live-off',!s.liveVisible)}

function configured(){return firebaseConfig.apiKey&&firebaseConfig.projectId&&firebaseConfig.databaseURL&&!firebaseConfig.apiKey.includes('SUA_')&&!firebaseConfig.projectId.includes('SEU-')}function initFirebase(){if(!configured()||typeof firebase==='undefined')return;try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);firebaseRef=firebase.database().ref('mazitek_placar');firebaseRef.on('value',s=>{if(s.val()){const d=norm(s.val());localStorage.setItem(STATE_KEY,JSON.stringify(d));render(d)}});firebase.database().ref('.info/connected').on('value',snap=>{if(snap.val()===true)firebaseRef.once('value').then(s=>{if(s.val()){const d=norm(s.val());localStorage.setItem(STATE_KEY,JSON.stringify(d));render(d)}})});setInterval(()=>{if(firebaseRef)firebaseRef.once('value').then(s=>{if(s.val())render(norm(s.val()))}).catch(()=>{})},20000)}catch(e){console.error(e)}}window.addEventListener('storage',e=>{if(e.key===STATE_KEY&&e.newValue)render(safe(e.newValue,base()))});if(channel)channel.onmessage=e=>{if(e.data?.type==='state')render(e.data.state)};function clock(){const n=new Date();clockValue.textContent=n.toLocaleDateString('pt-BR')+' '+n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}render(load());initFirebase();clock();setInterval(clock,1000);

let wakeLock=null;
async function requestWakeLock(){
  if(!('wakeLock'in navigator))return;
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}
  catch(e){console.warn('Wake Lock indisponível:',e)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestWakeLock();if(firebaseRef){try{firebase.database().goOnline()}catch(_){}firebaseRef.once('value').then(s=>{if(s.val()){const d=norm(s.val());localStorage.setItem(STATE_KEY,JSON.stringify(d));render(d)}}).catch(()=>{})}}});
requestWakeLock();

</script></body></html>
